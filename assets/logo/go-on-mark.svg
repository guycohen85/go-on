<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GO ON">
  <!-- Draft mark based on the client's icon: an awareness ribbon whose leg turns into a path forward, with a small sun. Flat colors, no gloss. -->
  <defs>
    <linearGradient id="goon-rainbow" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="0" y2="58">
      <stop offset="0" stop-color="#e5484d"/>
      <stop offset=".28" stop-color="#f5921e"/>
      <stop offset=".5" stop-color="#f2c230"/>
      <stop offset=".72" stop-color="#36a86b"/>
      <stop offset="1" stop-color="#3563d6"/>
    </linearGradient>
    <mask id="goon-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M22 30 L38 50" stroke="#000" stroke-width="13" stroke-linecap="butt"/>
    </mask>
  </defs>
  <!-- under strand -->
  <path d="M40 30 L18 57" fill="none" stroke="url(#goon-rainbow)" stroke-width="8" stroke-linecap="round" mask="url(#goon-gap)"/>
  <!-- loop and over strand, ending in the path forward -->
  <path d="M40 30 C46 20 43 5 31 5 C19 5 16 20 22 30 L38 50" fill="none" stroke="url(#goon-rainbow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 50 C42 55 48 57 60 56" fill="none" stroke="#3f9b4a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="54" cy="40" r="4.5" fill="#f2b632"/>
</svg>
