# Preview deploy to GitHub Pages (https://guycohen85.github.io/go-on/) on every push to main.
# The final site goes to Cloudflare Workers in the client's account (milestone 6).
name: Preview on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /go-on/
      SITE_URL: https://guycohen85.github.io
      PUBLIC_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run check:links
      # Keep the mockups the client already has links to (they use the logo mark from assets/).
      - name: Add the mockups
        run: |
          mkdir -p dist/docs dist/assets/logo
          cp -r docs/mockup dist/docs/mockup
          cp assets/logo/go-on-mark.svg dist/assets/logo/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
